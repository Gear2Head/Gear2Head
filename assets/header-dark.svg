  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="end">
    <text x="1144" y="108"><tspan fill="#e6edf3">1,600+</tspan> contributions since 2025</text>
    <text x="1144" y="140"><tspan fill="#e6edf3">2</tspan> apps live on Vercel</text>
    <text x="1144" y="172">learning <tspan fill="#e6edf3">C / C++</tspan> at school</text>
