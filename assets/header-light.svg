<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Gear_Head. Computer engineering student. I build React and Supabase apps.">
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .rise { animation: rise 520ms cubic-bezier(.2,.7,.3,1) both; }
    .fade { animation: fade 600ms ease-out both; }
    .rule { transform-box: fill-box; transform-origin: top; animation: draw 700ms cubic-bezier(.2,.7,.3,1) both; }
    @keyframes draw { from { transform: scaleY(0); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="12" fill="none" stroke="#d0d7de"/>
  
  <rect class="rule" x="48" y="64" width="4" height="132" fill="#bc4c00"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="rise" style="animation-delay:150ms" x="80" y="146" font-size="92" font-weight="700" letter-spacing="-3" fill="#1f2328">Gear<tspan fill="#bc4c00">_</tspan>Head</text>
    <text class="fade" style="animation-delay:400ms" x="84" y="192" font-size="24" fill="#59636e">Computer engineering student. I build React and Supabase apps.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#59636e" text-anchor="end">
    <text class="rise" style="animation-delay:750ms" x="1152" y="108"><tspan fill="#1f2328">1,600+</tspan> contributions since 2025</text>
    <text class="rise" style="animation-delay:900ms" x="1152" y="140"><tspan fill="#1f2328">2</tspan> apps live on Vercel</text>
    <text class="rise" style="animation-delay:1050ms" x="1152" y="172">learning <tspan fill="#1f2328">C / C++</tspan> at school</text>
  </g>
</svg>
